<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120203;--red:#e0262c;--orange:#ff8a1f;--text:#fff;--muted:#d9c3bf;--card:rgba(30,6,8,.8);--line:rgba(255,138,31,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",Arial,sans-serif;line-height:1.6;background-image:radial-gradient(900px 500px at 0 0,#6b0a10 0,transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,38px 38px,38px 38px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,2,3,.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,138,31,.25)}
nav ul{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;list-style:none;margin:0;padding:10px 12px}
nav a{display:block;padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap}
nav a:hover,nav a.on{color:var(--red);background:rgba(224,38,44,.12)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
section{max-width:1100px;margin:0 auto;padding:72px 20px}
h1,h2,h3{font-weight:800;line-height:1.1;margin:0}
h2{font-size:clamp(2rem,6vw,3rem);margin-bottom:28px}h2 b{color:var(--orange)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:end;gap:10px;padding-top:40px;padding-bottom:0;min-height:calc(100vh - 60px)}
.hero.solo{grid-template-columns:1fr;align-items:center}
.hello{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800}
.hello::after{content:"";display:block;width:150px;height:9px;border-radius:9px;background:#ff5a6e;margin-top:6px;transform-origin:left;animation:draw .9s .2s both}
@keyframes draw{from{transform:scaleX(0)}}
.meet{font-style:italic;font-weight:600;color:var(--orange);margin:26px 0 0;font-size:1.3rem}
.hero h1{font-size:clamp(2.1rem,6.5vw,4rem);color:var(--orange);margin:4px 0 14px}
.role{font-style:italic;font-weight:600;font-size:clamp(1.1rem,3vw,1.5rem);margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:40px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font:inherit;font-weight:600;text-decoration:none;border:1.5px solid var(--orange);background:transparent;color:var(--text);cursor:pointer}
.btn.main{background:linear-gradient(90deg,var(--red),var(--orange));border-color:transparent}
.btn:hover{filter:brightness(1.15)}
.photo{position:relative;align-self:end;justify-self:center;line-height:0;width:100%;max-width:400px}
.photo::before{content:"";position:absolute;inset:8% -10% 0;background:radial-gradient(closest-side,rgba(224,38,44,.45),transparent);z-index:0}
.photo img{position:relative;width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.frame{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 0 28px rgba(224,38,44,.25),inset 0 0 22px rgba(255,138,31,.07)}
.frame+.frame{margin-top:22px}.frame h3{font-size:1.35rem;margin-bottom:14px}
.frame p{margin:0 0 10px;color:#f4e7e4;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.grid2 .frame+.frame{margin-top:0}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--orange)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li::before{content:"";position:absolute;left:-26px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,138,31,.35)}
.tl strong{display:block}.tl span{color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 6px;padding:0}
.chips li{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.92rem;background:rgba(224,38,44,.1)}
.link{color:var(--orange);font-weight:600;word-break:break-all}
.shots{display:flex;gap:16px;overflow-x:auto;padding:18px 4px 8px;scroll-snap-type:x mandatory}
.shots figure{margin:0;flex:0 0 190px;scroll-snap-align:start}
.shots img{width:100%;height:auto;border-radius:14px;border:1.5px solid var(--line);display:block}
.shots figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
.contact ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}.contact a{text-decoration:none;font-weight:500}.contact a:hover{color:var(--orange)}
.contact small{display:block;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:28px 20px 40px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#2a0508;border:1.5px solid var(--orange);padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#adm{position:fixed;inset:0;z-index:60;background:#120203;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#adm .in{max-width:760px;margin:0 auto}
#adm h2{font-size:1.8rem;margin-bottom:6px}#adm .sub{color:var(--muted);margin:0 0 18px}
#adm details{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:12px;padding:0 16px}
#adm summary{cursor:pointer;font-weight:600;padding:14px 0}
#adm .body{padding:0 0 16px}
.f{display:block;margin-bottom:12px}.f span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.f input,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#1d0507;color:#fff;font:inherit}
.it{border:1px dashed rgba(255,138,31,.4);border-radius:12px;padding:12px;margin-bottom:12px}
.sm{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#fff;font:inherit;font-size:.9rem;cursor:pointer;margin:2px 6px 2px 0}
.sm.add{border-color:var(--orange);color:var(--orange)}.sm.del{border-color:#ff5a6e;color:#ff9aa6}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.prev{max-width:120px;border-radius:10px;border:1px solid var(--line);display:block;margin:6px 0}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 10px}
@media(max-width:760px){nav a{padding:6px 10px;font-size:.88rem}.hero{grid-template-columns:1fr;min-height:0}.photo{max-width:300px}.grid2{grid-template-columns:1fr}section{padding:56px 18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hello::after{animation:none}#toast{transition:none}}
